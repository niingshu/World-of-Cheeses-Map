<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset="UTF-8">
    <title> World Cheese Map </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- leaflet css file in the head section -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.3.0/dist/MarkerCluster.Default.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body> 
    <div class="on-top">
        <div class="top-bar">
            <h1 id="title" class="map-titles">World of Cheeses Map</h1>
        </div>
    </div>

    <!--search tool-->
    <div class="search">
        <input type="text" id="searchInput" placeholder="Search cheese...">
        <ul id="resultList"></ul>
    </div>

    <!--filtering button and options-->
    <div class="controls">
        <button id="filterBtn">Filter by country</button>
        <ul id="countryList" style="display:none;"></ul>
    </div>

    <!--dark/light mode toggle-->
    <button id="themeToggle" class="theme-toggle-btn" title="Toggle light/dark mode"></button>

    <!--panel-->
    <div id="cheese-panel" class="sidepanel">
        <!--data will be inserted here by js-->
    </div>

    <!--map-->
    <div id = "cheese-world-map"></div>

    <!-- leaflet javascript after leaflet's css-->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.3.0/dist/leaflet.markercluster.js"></script>

    <script src="js/api.js"></script>
    <script src="js/countryFlags.js"></script>
    <script src="js/map.js"></script>
    <script src="js/ui.js"></script> <!-- so API BASE is available -->
</body>
</html>
